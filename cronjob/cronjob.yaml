apiVersion: batch/v1
kind: CronJob
metadata:
  name: echo-command
spec:
  schedule: "30 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: sleep
            image: alpine
            command: 
            - echo
            - "Comunidade devops é top!"
          restartPolicy: "OnFailure"
