apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: nginx
  name: nginx-deployment
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - image: nginx
        name: nginx
        volumeMounts:
        - name: all-in-one
          mountPath: /tmp
      volumes:
      - name: all-in-one
        projected:
          sources:
          - configMap:
              name: nginx-demo
              items:
                - key: index.html
                  path: index.html
                - key: vhost.conf
                  path: vhost.conf
                - key: virtual_host
                  path: virtual_host
          - secret:
              name: credentials
              items:
                - key: username
                  path: creds/username
                - key: password
                  path: creds/password