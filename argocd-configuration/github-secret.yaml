apiVersion: v1
kind: Secret
metadata:
  name: ssh-argocd-github
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  type: git
  url: git@github.com:fastech-team/gitops-k8s.git
  sshPrivateKey: |
    -----BEGIN OPENSSH PRIVATE KEY-----
    -----END OPENSSH PRIVATE KEY-----
  insecure: "false"
  enableLfs: "false"
